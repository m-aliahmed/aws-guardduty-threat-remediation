AWSTemplateFormatVersion: '2010-09-09'
Description: Production Juice Shop - Native Installation for Vulnerability Testing (WORKING VERSION)

Parameters:
    EnvironmentName:
        Type: String
        Default: JuiceShop
        Description: A Vulnerable Web Application for Security Training
    
    InstanceType:
        Type: String
        Default: t3.micro
        Description: EC2 Instance Type
        AllowedValues:
            - t3.nano
            - t3.micro
            - t3a.micro
            - t4g.micro
        ConstraintDescription: must be a valid EC2 instance type.
    
    KeyName:
        Type: AWS::EC2::KeyPair::KeyName
        Description: Name of an existing EC2 KeyPair

Resources:
    JuiceShopVPC:
        Type: AWS::EC2::VPC
        Properties:
            CidrBlock: 10.0.3.0/26
            EnableDnsHostnames: true
            EnableDnsSupport: true
            Tags:
                - Key: Name
                  Value: !Sub ${EnvironmentName}-VPC

    MyInternetGateway:
        Type: AWS::EC2::InternetGateway
        Properties:
            Tags:
                - Key: Name
                  Value: !Sub ${EnvironmentName}-IG

    MyVPCGatewayAttachment:
        Type: AWS::EC2::VPCGatewayAttachment
        Properties:
            VpcId: !Ref JuiceShopVPC
            InternetGatewayId: !Ref MyInternetGateway
            
    MyVPCSubnet1:
        Type: AWS::EC2::Subnet
        Properties:
            VpcId: !Ref JuiceShopVPC
            CidrBlock: 10.0.3.0/28
            AvailabilityZone: !Select [ 0, !GetAZs '' ]
            MapPublicIpOnLaunch: true
            Tags:
                - Key: Name
                  Value: !Sub ${EnvironmentName}-Subnet1
    
    MyVPCSubnet2:
        Type: AWS::EC2::Subnet
        Properties:
            VpcId: !Ref JuiceShopVPC
            CidrBlock: 10.0.3.16/28
            AvailabilityZone: !Select [ 1, !GetAZs '' ]
            MapPublicIpOnLaunch: true
            Tags:
                - Key: Name
                  Value: !Sub ${EnvironmentName}-Subnet2

    MyRouteTable:
        Type: AWS::EC2::RouteTable
        Properties:
            VpcId: !Ref JuiceShopVPC
            Tags: 
                - Key: Name
                  Value: !Sub ${EnvironmentName}-RouteTable

    MyInternetRoute:
        Type: AWS::EC2::Route
        DependsOn: MyVPCGatewayAttachment
        Properties:
            RouteTableId: !Ref MyRouteTable
            DestinationCidrBlock: 0.0.0.0/0
            GatewayId: !Ref MyInternetGateway

    MySubnetAssociation1:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
            RouteTableId: !Ref MyRouteTable
            SubnetId: !Ref MyVPCSubnet1
            
    MySubnetAssociation2:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
            RouteTableId: !Ref MyRouteTable
            SubnetId: !Ref MyVPCSubnet2

    MyLbSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Allow HTTP and HTTPS from everywhere
            VpcId: !Ref JuiceShopVPC
            SecurityGroupIngress:
                - IpProtocol: tcp
                  FromPort: 80
                  ToPort: 80
                  CidrIp: 0.0.0.0/0
                - IpProtocol: tcp
                  FromPort: 443
                  ToPort: 443
                  CidrIp: 0.0.0.0/0

    MyServerSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Allow HTTP from Load Balancer and SSH
            VpcId: !Ref JuiceShopVPC
            SecurityGroupIngress:
                - IpProtocol: tcp
                  FromPort: 80
                  ToPort: 80
                  SourceSecurityGroupId: !Ref MyLbSecurityGroup
                - IpProtocol: tcp
                  FromPort: 22
                  ToPort: 22
                  CidrIp: 0.0.0.0/0

    MyS3Bucket:
        Type: AWS::S3::Bucket
        DeletionPolicy: Delete
        Properties:
            BucketEncryption:
                ServerSideEncryptionConfiguration:
                    - ServerSideEncryptionByDefault:
                        SSEAlgorithm: AES256
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true

    MyEc2Role:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                        Service: "ec2.amazonaws.com"
                      Action: 'sts:AssumeRole'
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
            Policies:
                - PolicyName: InstanceS3Policy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                        - Effect: Allow
                          Action: ["s3:GetObject", "s3:ListBucket", "s3:PutObject"]
                          Resource: 
                            - !GetAtt MyS3Bucket.Arn
                            - !Sub ${MyS3Bucket.Arn}/*
                - PolicyName: CloudFormationSignal
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                        - Effect: Allow
                          Action:
                            - "cloudformation:SignalResource"
                            - "cloudformation:DescribeStackResource"
                          Resource: "*"

    MyInstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles: [ !Ref MyEc2Role ]

    MyinstanceTargetgroup:
        Type: AWS::ElasticLoadBalancingV2::TargetGroup
        Properties:
            Port: 80
            Protocol: HTTP
            VpcId: !Ref JuiceShopVPC
            TargetType: instance
            HealthCheckEnabled: true
            HealthCheckPath: /
            HealthCheckIntervalSeconds: 30
            HealthCheckTimeoutSeconds: 5
            HealthyThresholdCount: 2
            UnhealthyThresholdCount: 3
            Matcher:
                HttpCode: 200-399

    MyLoadBalancer:
        Type: AWS::ElasticLoadBalancingV2::LoadBalancer
        Properties:
            Scheme: internet-facing
            Subnets:
                - !Ref MyVPCSubnet1
                - !Ref MyVPCSubnet2
            SecurityGroups: [ !Ref MyLbSecurityGroup ]
            Type: application

    MyListener:
        Type: AWS::ElasticLoadBalancingV2::Listener
        Properties:
            LoadBalancerArn: !Ref MyLoadBalancer
            DefaultActions: 
                - Type: forward
                  TargetGroupArn: !Ref MyinstanceTargetgroup
            Port: 80
            Protocol: HTTP

    MyAutoScalingGroup:
        Type: AWS::AutoScaling::AutoScalingGroup
        CreationPolicy:
            ResourceSignal:
                Timeout: PT15M
                Count: 1
        Properties:
            VPCZoneIdentifier:
                - !Ref MyVPCSubnet1
                - !Ref MyVPCSubnet2
            LaunchTemplate: 
                LaunchTemplateId: !Ref MyLaunchTemplate
                Version: !GetAtt MyLaunchTemplate.LatestVersionNumber
            MinSize: 1
            MaxSize: 2
            DesiredCapacity: 1
            TargetGroupARNs: [ !Ref MyinstanceTargetgroup ]
            HealthCheckType: ELB
            HealthCheckGracePeriod: 600
            Tags:
                - Key: Name
                  PropagateAtLaunch: true 
                  Value: !Sub ${EnvironmentName}-ASG

    MyLaunchTemplate:
        Type: AWS::EC2::LaunchTemplate
        Properties:
            LaunchTemplateData:
                ImageId: resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
                InstanceType: !Ref InstanceType
                KeyName: !Ref KeyName
                SecurityGroupIds: [ !Ref MyServerSecurityGroup ]
                IamInstanceProfile: 
                    Name: !Ref MyInstanceProfile
                UserData: 
                    Fn::Base64: !Sub | 
                        #!/bin/bash -xe
                        exec > >(tee /var/log/user-data.log) 2>&1
                        
                        echo "=========================================="
                        echo "USERDATA START: $(date)"
                        echo "Stack: ${AWS::StackName}"
                        echo "Region: ${AWS::Region}"
                        echo "=========================================="
                        
                        # Variables
                        STACK_NAME="${AWS::StackName}"
                        REGION="${AWS::Region}"
                        
                        # Function to signal and exit
                        signal_and_exit() {
                            local exit_code=$1
                            local message="$2"
                            echo "$message"
                            
                            # Get instance ID using IMDSv2
                            TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" 2>/dev/null)
                            INSTANCE_ID=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null)
                            
                            # Try cfn-signal first
                            if command -v cfn-signal >/dev/null 2>&1; then
                                cfn-signal -e $exit_code --stack "$STACK_NAME" --resource MyAutoScalingGroup --region "$REGION"
                            else
                                # Fallback to AWS CLI
                                echo "Using AWS CLI fallback..."
                                STATUS=$([ $exit_code -eq 0 ] && echo "SUCCESS" || echo "FAILURE")
                                aws cloudformation signal-resource \
                                    --stack-name "$STACK_NAME" \
                                    --logical-resource-id MyAutoScalingGroup \
                                    --unique-id "$INSTANCE_ID" \
                                    --status "$STATUS" \
                                    --region "$REGION" 2>&1 || echo "Signal failed!"
                            fi
                            exit $exit_code
                        }
                        
                        # Step 1: Update system
                        echo "[1/10] Updating system packages..."
                        apt-get update -y || signal_and_exit 1 "apt-get update failed"
                        
                        # Step 2: Install base packages including CFN tools
                        echo "[2/10] Installing base packages and CFN tools..."
                        DEBIAN_FRONTEND=noninteractive apt-get install -y \
                            python3-pip \
                            python3-setuptools \
                            wget \
                            curl \
                            nginx \
                            awscli \
                            ca-certificates \
                            gnupg || signal_and_exit 1 "Failed to install base packages"
                        
                        # Step 3: Install CloudFormation helper scripts (FIXED - no --break-system-packages)
                        echo "[3/10] Installing CloudFormation helper scripts..."
                        pip3 install https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz \
                            || signal_and_exit 1 "Failed to install cfn-bootstrap"
                        
                        # Create symlinks for cfn tools
                        for tool in cfn-signal cfn-init cfn-hup cfn-get-metadata; do
                            ln -sf /usr/local/bin/$tool /usr/bin/$tool 2>/dev/null || true
                        done
                        
                        # Verify cfn-signal is available
                        if ! command -v cfn-signal >/dev/null 2>&1; then
                            echo "WARNING: cfn-signal not in PATH, will use AWS CLI fallback"
                        else
                            echo "cfn-signal found at: $(which cfn-signal)"
                        fi


                        # Step 3.5: Setup the CTF Challenge (The Secret Flag)
                        echo "[3.5/10] Creating and Uploading Secret Flag..."
                        echo "Dang it - if you can see this text, you're accessing our private information!" > /tmp/secret-information.txt
                        
                        # Upload to S3 (Using the template variable for the bucket name)
                        aws s3 cp /tmp/secret-information.txt s3://${MyS3Bucket}/secret-information.txt \
                            || signal_and_exit 1 "Failed to upload Secret Flag to S3"
                        
                        echo "Secret Flag uploaded successfully."

                        
                        # Step 4: Install Node.js 18 LTS (required for Juice Shop)
                        echo "[4/10] Installing Node.js 18 LTS..."
                        curl -fsSL https://deb.nodesource.com/setup_18.x | bash - \
                            || signal_and_exit 1 "Failed to add NodeSource repository"
                        
                        apt-get install -y nodejs || signal_and_exit 1 "Failed to install Node.js"
                        
                        # Verify Node.js installation
                        echo "Node.js version: $(node --version)"
                        echo "npm version: $(npm --version)"
                        
                        # Step 5: Create Juice Shop user
                        echo "[5/10] Creating Juice Shop user..."
                        useradd -r -m -s /bin/bash juicer || echo "User already exists"
                        
                        # Step 6: Download Juice Shop
                        echo "[6/10] Downloading Juice Shop v16.0.1..."
                        cd /tmp
                        wget -q https://github.com/juice-shop/juice-shop/releases/download/v16.0.1/juice-shop-16.0.1_node18_linux_x64.tgz \
                            || signal_and_exit 1 "Failed to download Juice Shop"
                        
                        # Step 7: Extract and install Juice Shop
                        echo "[7/10] Extracting Juice Shop..."
                        tar -xzf juice-shop-16.0.1_node18_linux_x64.tgz \
                            || signal_and_exit 1 "Failed to extract Juice Shop"
                        
                        mv juice-shop_16.0.1 /juice-shop || signal_and_exit 1 "Failed to move Juice Shop"
                        chown -R juicer:juicer /juice-shop || signal_and_exit 1 "Failed to set permissions"
                        
                        # Step 8: Create systemd service
                        echo "[8/10] Creating Juice Shop systemd service..."
                        cat > /etc/systemd/system/juice-shop.service << 'EOFSERVICE'
                        [Unit]
                        Description=OWASP Juice Shop
                        After=network.target
                        
                        [Service]
                        Type=simple
                        User=juicer
                        Group=juicer
                        WorkingDirectory=/juice-shop
                        Environment="NODE_ENV=production"
                        Environment="PORT=3000"
                        ExecStart=/usr/bin/npm start
                        Restart=always
                        RestartSec=10
                        StandardOutput=journal
                        StandardError=journal
                        SyslogIdentifier=juice-shop
                        
                        [Install]
                        WantedBy=multi-user.target
                        EOFSERVICE
                        
                        # Configure Nginx as reverse proxy
                        echo "[8/10] Configuring Nginx..."
                        cat > /etc/nginx/sites-available/juice-shop << 'EOFNGINX'
                        server {
                            listen 80 default_server;
                            listen [::]:80 default_server;
                            server_name _;
                            
                            location / {
                                proxy_pass http://127.0.0.1:3000;
                                proxy_http_version 1.1;
                                proxy_set_header Upgrade $http_upgrade;
                                proxy_set_header Connection 'upgrade';
                                proxy_set_header Host $host;
                                proxy_cache_bypass $http_upgrade;
                                proxy_set_header X-Real-IP $remote_addr;
                                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                                proxy_set_header X-Forwarded-Proto $scheme;
                                
                                # Timeouts
                                proxy_connect_timeout 60s;
                                proxy_send_timeout 60s;
                                proxy_read_timeout 60s;
                            }
                        }
                        EOFNGINX
                        
                        # Enable Nginx configuration
                        ln -sf /etc/nginx/sites-available/juice-shop /etc/nginx/sites-enabled/juice-shop
                        rm -f /etc/nginx/sites-enabled/default
                        
                        # Test Nginx configuration
                        nginx -t || signal_and_exit 1 "Nginx configuration test failed"
                        
                        # Step 9: Start services
                        echo "[9/10] Starting Juice Shop and Nginx services..."
                        systemctl daemon-reload
                        systemctl enable juice-shop || signal_and_exit 1 "Failed to enable Juice Shop"
                        systemctl start juice-shop || signal_and_exit 1 "Failed to start Juice Shop"
                        systemctl enable nginx || signal_and_exit 1 "Failed to enable Nginx"
                        systemctl restart nginx || signal_and_exit 1 "Failed to start Nginx"
                        
                        # Step 10: Wait for Juice Shop to be ready
                        echo "[10/10] Waiting for Juice Shop to become ready..."
                        MAX_ATTEMPTS=60
                        ATTEMPT=0
                        
                        while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
                            ATTEMPT=$((ATTEMPT + 1))
                            
                            # Check if service is running
                            if ! systemctl is-active --quiet juice-shop; then
                                echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Service not active yet..."
                                sleep 5
                                continue
                            fi
                            
                            # Check if application responds
                            if curl -sf http://localhost:3000/ >/dev/null 2>&1; then
                                echo "SUCCESS: Juice Shop is responding on port 3000!"
                                break
                            fi
                            
                            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Waiting for application to respond..."
                            sleep 5
                        done
                        
                        # Final verification
                        if ! curl -sf http://localhost:3000/ >/dev/null 2>&1; then
                            echo "ERROR: Juice Shop failed to start after $MAX_ATTEMPTS attempts"
                            echo "=== Service Status ==="
                            systemctl status juice-shop --no-pager
                            echo "=== Last 50 Journal Entries ==="
                            journalctl -u juice-shop -n 50 --no-pager
                            signal_and_exit 1 "Juice Shop failed to start"
                        fi
                        
                        # Verify Nginx proxy
                        echo "Verifying Nginx reverse proxy..."
                        if ! curl -sf http://localhost:80/ >/dev/null 2>&1; then
                            echo "ERROR: Nginx proxy verification failed"
                            systemctl status nginx --no-pager
                            signal_and_exit 1 "Nginx proxy not working"
                        fi
                        
                        echo "=========================================="
                        echo "SUCCESS: All services are running!"
                        echo "Juice Shop: http://localhost:3000"
                        echo "Nginx Proxy: http://localhost:80"
                        echo "USERDATA END: $(date)"
                        echo "=========================================="
                        
                        # Signal success to CloudFormation
                        signal_and_exit 0 "Installation completed successfully"

Outputs:
    LoadBalancerDNS:
        Description: Juice Shop URL
        Value: !Sub "http://${MyLoadBalancer.DNSName}"
        Export:
            Name: !Sub "${AWS::StackName}-LoadBalancerURL"
    
    S3BucketName:
        Description: S3 Bucket for storage
        Value: !Ref MyS3Bucket
    
    DebugInfo:
        Description: SSH into instance and check logs
        Value: !Sub "ssh -i ${KeyName}.pem ubuntu@<instance-ip> 'sudo tail -f /var/log/user-data.log'"